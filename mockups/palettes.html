<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palette directions · Protoa mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap">
<style>
  body{margin:0;padding:40px;background:#1c1f24;color:#f2f4f7;font:500 16px/1.4 Sora,system-ui,sans-serif}
  h1{margin:0 0 4px;font-size:34px;letter-spacing:-.02em} p{margin:0 0 28px;color:#b9c0ca;font-size:18px}
  .row{display:flex;gap:24px;margin-bottom:24px}
  iframe{width:390px;height:844px;border:0;border-radius:28px;background:#fff;flex:none}
</style>
</head>
<body>
<h1 id="t"></h1><p id="d"></p>
<div class="row" id="light"></div>
<div class="row" id="dark"></div>
<script>
const P = new URLSearchParams(location.search).get('p') || 'now';
const INFO = {
  now: ['Now', 'The current palette, for comparison.'],
  a: ['A · Altbau', 'The pastel facades of Neukölln: warm stone ground, sage and apricot fields, deep petrol panes.'],
  b: ['B · U-Bahn', 'The transit system: cool tiled ground, BVG yellow for arrivals and wins, U-Bahn navy panes.'],
  c: ['C · Blaue Stunde', 'Berlin at blue hour, the orb\'s own world: ultramarine fields, ice-cyan light, street-lamp amber.']
};
document.getElementById('t').textContent = INFO[P][0];
document.getElementById('d').textContent = INFO[P][1];
const SCREENS = ['today.html?', 'scene.html?', 'words.html?frame=1&', 'conv.html?frame=1&', 'done.html?'];
for (const theme of ['light', 'dark'])
  for (const s of SCREENS)
    document.getElementById(theme).insertAdjacentHTML('beforeend', `<iframe src="${s}theme=${theme}${P === 'now' ? '' : '&palette=' + P}"></iframe>`);
</script>
</body>
</html>
