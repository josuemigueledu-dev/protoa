  /* primary action: glossy ink */
  --act-1:#262b33; --act-2:#06080b; --act-ink:#ffffff; --act-glow:rgba(18,40,90,.35);
  /* hero panes: black glass */
  --pane-1:#07090d; --pane-2:#141b28; --pane-ink:#f1f6ff; --pane-muted:rgba(225,236,255,.72);
  /* semantic */
  --red:#a51f3a; --red-deep:#82142b; --red-soft:rgba(196,44,72,.11);
  --blue:#1f5fd1; --blue-deep:#123f99; --blue-soft:rgba(31,95,209,.11);
  --green:#07624a; --green-deep:#044634; --green-soft:rgba(10,117,86,.11);
  --der:var(--blue); --die:var(--red); --das:var(--green);

  /* type */
  --display:'Sora','Manrope',system-ui,sans-serif; --text:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --t-title:1.625rem; --t-body:1.0625rem; --t-cap:.8125rem; --t-de:1.25rem; --t-small:.8125rem;
  --r:24px; --r-sm:14px; --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.2,1.35,.4,1);
  color-scheme:light;

  --curve:rgba(0,0,0,.2); --edge-1:rgba(255,255,255,.14); --edge-2:rgba(0,0,0,.65); --drop-1:rgba(0,0,0,.55); --drop-2:rgba(0,0,0,.6); --caustic:rgba(60,140,255,.10);

  --shadow-lg:0 0 0 1px rgba(150,180,240,.05),0 20px 44px -16px rgba(0,0,0,.7),0 50px 100px -40px rgba(0,0,0,.9);
  --aur-1:rgba(40,70,130,.42); --aur-2:rgba(18,30,60,.6); --aur-3:rgba(60,130,255,.14); --aur-4:rgba(160,190,240,.07); --gridline:rgba(200,215,240,.03); --orbit:rgba(190,210,240,.11); --orbit-hi:rgba(110,170,255,.36);

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:var(--t-body);font-weight:600;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.015em;font-size:var(--t-title)}
h2,h3{font-size:var(--t-body);letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
:where([lang="de"]){font-size:var(--t-de)}
.gl [lang="de"],.tile[lang="de"],.de-input,.gapline,.btile [lang="de"],.wcard .de [lang="de"]{font-size:inherit}
a{color:var(--blue)}
.sr{position:absolute;left:-9999px}

/* ---------- frame: three layout modes set on <body> by applyLayout() ----------
   lay-mobile  (< 640px or forced): single column, bottom tab bar
   lay-tablet  (640–1023px):        single column, tabs in the top bar
   lay-desktop (≥ 1024px or forced): sidebar · centre column · context rail */
#app{min-height:100%;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.sidebar,.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:16px;height:64px}
.brand{font-family:var(--display);font-weight:800;font-size:var(--t-title);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .dot{width:28px;height:28px;border-radius:8px;background:var(--yellow);color:var(--on-yellow);font-size:var(--t-cap);display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:none}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:8px 14px;border-radius:999px;font-weight:800;color:var(--muted);min-height:44px;display:flex;align-items:center;gap:8px;font-size:var(--t-cap);letter-spacing:.02em;position:relative}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tab svg{width:20px;height:20px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:var(--on-status);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tab .badge{position:absolute;top:2px;right:4px}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
body.lay-mobile main{padding-bottom:112px}
body.lay-mobile .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--card);box-shadow:0 -1px 0 var(--line);padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));justify-content:space-around;z-index:9}
body.lay-mobile .tab{flex-direction:column;gap:2px;padding:4px 6px;min-width:56px;border-radius:14px}
body.lay-mobile .tab[aria-current="page"]{background:transparent;box-shadow:none}
body.lay-mobile .tab[aria-current="page"] svg{background:var(--yellow);color:var(--on-yellow);border-radius:10px;padding:3px;width:32px;height:28px}
body.lay-mobile .tab svg{width:26px;height:26px}
body.lay-mobile .tab .badge{top:-2px;right:0}
body.lay-tablet .topbar-in,body.lay-tablet .wrap{max-width:720px}
/* desktop */
body.lay-desktop .topbar{display:none}
body.lay-desktop .sidebar{display:flex;flex-direction:column;gap:4px;width:248px;flex:none;position:sticky;top:0;height:100vh;padding:24px 16px;box-shadow:inset -2px 0 0 var(--line);background:var(--bg);z-index:9}
body.lay-desktop .sidebar .brand{padding:0 8px 24px}
body.lay-desktop .rail{display:flex;flex-direction:column;gap:16px;width:348px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:32px 24px 32px 8px}
body.lay-desktop main{padding:32px 32px 64px}
body.lay-desktop .wrap{max-width:680px}
body.lay-desktop.in-lesson .sidebar,body.lay-desktop.in-lesson .rail{display:none}
body.in-lesson .topbar,body.in-lesson .tabs{display:none}
body.in-lesson main{padding-bottom:144px;padding-top:0}
body.lay-desktop.in-lesson main{padding-top:16px}
@media (max-width:1240px){body.lay-desktop .rail{display:none}}
@media (max-width:880px){body.lay-desktop .sidebar{width:84px;align-items:center} body.lay-desktop .sidebar .nav span,body.lay-desktop .sidebar .brand .name,body.lay-desktop .sidebar .goalmini .txt,body.lay-desktop .sidebar .kbdhint{display:none} body.lay-desktop .sidebar .nav{justify-content:center;padding:12px}}
.nav{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:16px;font-weight:800;color:var(--muted);min-height:52px;width:100%;text-align:left;position:relative}
.nav svg{width:26px;height:26px;flex:none}
.nav:hover{background:var(--bg-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--yellow-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--yellow)}
.nav .badge{margin-left:auto}
body.lay-desktop .sidebar .nav .badge{position:static}
@media (max-width:880px){body.lay-desktop .sidebar .nav .badge{position:absolute;top:4px;right:4px}}
.sidebar .spacer{flex:1}
.goalmini{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.goalmini .ring{width:48px;height:48px}
.goalmini .txt{display:flex;flex-direction:column;line-height:1.25} .goalmini .txt b{font-family:var(--display)} .goalmini .txt span{font-size:var(--t-cap);color:var(--muted)}
.kbdhint{font-size:var(--t-cap);color:var(--muted);padding:8px 8px 0}

/* ---------- surfaces & text ---------- */
.card{background:var(--card);border-radius:var(--r);padding:24px;min-width:0;box-shadow:var(--shadow)}
.card.soft{background:var(--bg-2);box-shadow:none}
.card.flat{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.eyebrow{font-size:var(--t-cap);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .faint,.small{font-size:var(--t-cap);color:var(--muted)} .small{color:inherit}
.center{text-align:center;align-items:center}
.big{font-family:var(--display);font-size:var(--t-title);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}

/* ---------- controls: tactile ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 24px;border-radius:16px;font-weight:800;font-size:var(--t-body);background:var(--yellow);color:var(--on-yellow);box-shadow:none;transition:transform .08s,box-shadow .08s,filter .12s;white-space:nowrap;letter-spacing:.01em}
.btn:hover{filter:brightness(1.04)} .btn:active{transform:scale(.98);box-shadow:none}
.btn.ghost,.btn.quiet{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active,.btn.quiet:active{box-shadow:inset 0 0 0 2px var(--line),0 0 0 var(--line-2)}
.btn.ink{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.ok{background:var(--green);color:var(--on-status);box-shadow:none} .btn.bad{background:var(--red);color:var(--on-status);box-shadow:none}
.btn.sm{min-height:44px;padding:8px 16px;border-radius:12px;font-size:var(--t-cap);box-shadow:none}
.btn.sm.ghost,.btn.sm.quiet{box-shadow:inset 0 0 0 2px var(--line)}
.btn.wide{width:100%}
.btn{max-width:100%} .btn.sm{white-space:normal;text-align:left;line-height:1.25}
.btn[disabled]{opacity:.45;cursor:default;transform:scale(.98);box-shadow:none}
.btn svg{width:18px;height:18px} .btn .sig{width:22px;height:22px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);flex:none;box-shadow:inset 0 0 0 2px var(--line);transition:transform .08s,box-shadow .08s}
.icon-btn:active{transform:scale(.98);box-shadow:inset 0 0 0 2px var(--line)}
.icon-btn svg{width:18px;height:18px} .icon-btn.sm{width:40px;height:40px} .icon-btn.sm svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;font-size:var(--t-cap);font-weight:800;background:var(--bg-2);color:var(--muted)}
.chip.ok{background:var(--green-soft);color:var(--green)} .chip.yours{background:var(--yellow-soft);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:var(--t-cap);color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:12px 16px;min-height:52px;width:100%;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--yellow);outline:none}
textarea{min-height:88px;resize:vertical}
.de-input{font-size:var(--t-de);font-weight:700}
.umlauts{display:flex;gap:8px;flex-wrap:wrap}
.umlauts button{min-width:44px;min-height:40px;border-radius:10px;background:var(--card);font-weight:800;box-shadow:inset 0 0 0 2px var(--line)}
.umlauts button:active{transform:scale(.98);box-shadow:inset 0 0 0 2px var(--line)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px}
.toggle input{width:48px;height:28px;appearance:none;background:var(--line-2);border-radius:999px;position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--green)} .toggle input:checked::after{left:23px}
.seg{display:inline-flex;background:var(--bg-2);border-radius:999px;padding:4px;gap:4px}
.seg button{padding:8px 16px;min-height:36px;border-radius:999px;font-weight:800;color:var(--muted);font-size:var(--t-cap)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.kbd,.choice kbd{font:800 var(--t-cap) var(--text);background:var(--bg-2);border-radius:8px;padding:2px 8px;color:var(--muted);min-width:28px;text-align:center}

/* progress */
.prog{display:flex;flex-direction:column;gap:8px}
.prog .nums{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{height:12px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .5s var(--ease);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.ring{width:44px;height:44px;flex:none}
.ring circle{fill:none;stroke-width:4} .ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--yellow);stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.g-m{color:var(--der)} .g-f{color:var(--die)} .g-n{color:var(--das)}

/* gloss */
.gl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;line-height:1.1;margin:0;padding:0;list-style:none}
.gl li{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.gl .w{font-family:var(--display);font-size:var(--t-de);font-weight:700;padding:4px 4px;border-radius:8px;cursor:pointer;min-height:32px;line-height:1.2}
.gl .w:hover{background:var(--yellow-soft)} .gl .w.speaking{background:var(--yellow);color:var(--on-yellow)}
.gl .e{font-size:var(--t-cap);color:var(--muted);text-align:center;max-width:14ch;line-height:1.15;font-weight:700}
.hide-gloss .gl .e{visibility:hidden}

/* ---------- icons & word cards ---------- */
.sig{display:inline-flex;align-items:center;justify-content:center;flex:none}
.sig svg{width:100%;height:100%}
.illus{width:96px;height:96px;flex:none;border-radius:24px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.illus svg{width:80px;height:80px} .illus.sm{width:56px;height:56px;border-radius:16px} .illus.sm svg{width:44px;height:44px}
.wcard{display:grid;gap:16px;justify-items:center;text-align:center}
.wcard .illus{width:168px;height:168px;border-radius:40px;background:var(--yellow-soft)}
.wcard .illus svg{width:136px;height:136px}
.wcard .illus.m{background:var(--blue-soft)} .wcard .illus.f{background:var(--red-soft)} .wcard .illus.n{background:var(--green-soft)}
.wcard .de{font-family:var(--display);font-size:2.5rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.wcard .en{font-size:var(--t-body);color:var(--muted);font-weight:700}
.wcard .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:var(--t-cap);color:var(--muted)}
.wcard .meta span{background:var(--bg-2);border-radius:999px;padding:4px 12px} .wcard .meta b{color:var(--ink)}
.example{border-top:2px solid var(--bg-2);padding-top:16px;display:grid;gap:8px;width:100%;justify-items:center}
.conj{display:grid;grid-template-columns:auto auto;gap:4px 24px;justify-content:center;font-size:var(--t-cap)}
.conj span:nth-child(odd){color:var(--muted)} .conj b{font-family:var(--display);font-size:var(--t-body)}

/* tiles & choices */
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;justify-content:center}
.tiles.answer{min-height:72px;border-bottom:2px solid var(--line);border-radius:0;align-content:flex-end}
.tile{padding:8px 16px;border-radius:14px;background:var(--card);font-family:var(--display);font-weight:700;font-size:var(--t-de);min-height:48px;box-shadow:inset 0 0 0 2px var(--line);transition:transform .2s var(--spring),box-shadow .08s;cursor:pointer}
.tile:active{transform:scale(.98);box-shadow:inset 0 0 0 2px var(--line)}
.tiles.answer .tile{animation:settle .3s var(--spring)}
.choices{display:grid;gap:8px}
.choice{padding:16px;border-radius:18px;background:var(--card);font-weight:800;text-align:left;min-height:56px;display:flex;align-items:center;gap:16px;box-shadow:inset 0 0 0 2px var(--line);transition:transform .08s,box-shadow .12s}
.choice:hover{box-shadow:inset 0 0 0 2px var(--yellow)}
.choice:active{transform:scale(.98);box-shadow:inset 0 0 0 2px var(--line)}
.choice.ok{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 2px var(--green);animation:settle .4s var(--spring)}
.choice.bad{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 2px var(--red);animation:shake .35s}
.card.ok-edge{box-shadow:inset 0 0 0 3px var(--green),var(--shadow);animation:settle .4s var(--spring)}
.card.bad-edge{box-shadow:inset 0 0 0 3px var(--red),var(--shadow);animation:shake .35s}
@keyframes settle{0%{transform:translateY(6px)}60%{transform:translateY(-3px)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* feedback */
.fb{border-radius:16px;padding:12px 16px;font-weight:700;display:flex;gap:8px;align-items:flex-start;line-height:1.4;font-size:var(--t-body)}
.fb.ok{background:var(--green-soft);color:var(--green)} .fb.bad{background:var(--red-soft);color:var(--red)} .fb.hint{background:var(--blue-soft);color:var(--ink)} .fb.note{background:var(--yellow-soft);color:var(--ink)}
.fb em{font-style:normal;font-weight:800;font-family:var(--display)}
.ladder{display:flex;flex-direction:column;gap:8px}
.ladder .fb{animation:ladderin .3s var(--ease)}
@keyframes ladderin{from{transform:translateY(12px)}to{transform:none}}

/* ---------- lesson chrome ---------- */
.lesson-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:16px 0 16px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center}
.lesson-top .who{display:flex;align-items:center;gap:8px;min-width:0}
.lesson-top .who .sig{width:32px;height:32px}
.lesson-top .who b{font-family:var(--display);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-top .who span{color:var(--muted);font-size:var(--t-cap);white-space:nowrap}
.lesson-top .segs{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lesson-top .segs i{height:12px;border-radius:999px;background:var(--bg-2);overflow:hidden;position:relative}
.lesson-top .segs i b{position:absolute;inset:0 auto 0 0;background:var(--yellow);border-radius:999px;transition:width .5s var(--ease);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.lesson-top .close{justify-self:end}
.lesson-top .steplbl{grid-column:1/-1;font-size:var(--t-cap);color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:-4px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--bg);box-shadow:0 -1px 0 var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:600px;margin:0 auto;display:flex;gap:8px}
.actionbar .in .btn{flex:1}
.actionbar .in .btn.ghost{flex:0 0 auto}
.actionbar.ok,.actionbar.bad{animation:springup .32s var(--spring)}
.actionbar.ok{background:var(--green-soft);box-shadow:none} .actionbar.bad{background:var(--red-soft);box-shadow:none}
.actionbar .msg{max-width:600px;margin:0 auto 16px;display:flex;gap:16px;align-items:flex-start}
.actionbar .msg .ico{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--t-body);background:var(--card)}
.actionbar.ok .msg .ico{color:var(--green)} .actionbar.bad .msg .ico{color:var(--red)}
.actionbar .msg .ttl{font-family:var(--display);font-weight:800;font-size:var(--t-de);line-height:1.1;display:block;margin-bottom:4px}
.actionbar.ok .msg{color:var(--green)} .actionbar.bad .msg{color:var(--red)}
.actionbar.ok .in .btn{background:var(--green);color:var(--on-status);box-shadow:none} .actionbar.bad .in .btn{background:var(--red);color:var(--on-status);box-shadow:none}
.actionbar.ok .in .btn.ghost,.actionbar.bad .in .btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.actionbar .in .btn:active{box-shadow:none!important}
@keyframes springup{from{transform:translateY(24px)}to{transform:none}}
.scene{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sky);aspect-ratio:16/9;max-width:100%}
.scene svg{width:100%;height:100%;display:block}
.scene .cap{position:absolute;left:16px;bottom:16px;background:rgba(16,24,43,.82);color:#fff;font-size:var(--t-cap);font-weight:800;padding:4px 12px;border-radius:999px}
.notice-line{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);border-left:6px solid var(--yellow)}
.coach{display:flex;align-items:flex-end;gap:8px}
.coach .say{background:var(--card);border-radius:18px;border-bottom-left-radius:4px;padding:12px 16px;font-weight:700;box-shadow:var(--shadow);animation:settle .35s var(--spring)}

/* conversation */
.conv{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.conv .bgscene{position:absolute;inset:0;opacity:.16;pointer-events:none}
.conv .bgscene svg{width:100%;height:100%}
.conv .log{position:relative;display:flex;flex-direction:column;gap:16px;padding:16px;min-height:160px}
.bub{max-width:92%;display:flex;gap:8px;align-items:flex-end;animation:settle .3s var(--spring)}
.bub.w{align-self:flex-start} .bub.l{align-self:flex-end;flex-direction:row-reverse}
.bub .ava{width:44px;height:44px;flex:none}
.bub .box{background:var(--card);border-radius:20px;padding:12px 16px;min-width:0;position:relative;box-shadow:var(--shadow)}
.bub.w .box{border-bottom-left-radius:6px} .bub.l .box{border-bottom-right-radius:6px;background:var(--yellow-soft)}
.bub.l.done .box{background:var(--green-soft)}
.bub .check{position:absolute;right:-8px;top:-8px;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--on-status);font-size:var(--t-cap);display:flex;align-items:center;justify-content:center;font-weight:800}
.bub .en-after{font-size:var(--t-cap);color:var(--muted);margin-top:4px}
.turnbox{position:relative;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:16px;box-shadow:0 -2px 0 var(--bg-2)}
.turnbox .prompt{font-weight:800}
.gapline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--t-de);font-weight:700;font-family:var(--display)}
.gapline input{width:7.5em;min-height:48px;padding:4px 8px;font-size:var(--t-de);text-align:center;font-family:var(--display)}
.reaction{font-size:var(--t-cap);color:var(--muted);font-style:italic;margin-top:4px}
.mic{display:inline-flex;align-items:center;gap:8px}
.mic.on .icon-btn{background:var(--red-soft);color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,47,57,.35)}50%{box-shadow:0 0 0 8px rgba(196,47,57,0)}}


/* ---------- screen transitions (forward slides left, back slides right) ---------- */
.view.fwd{animation:fromright .25s var(--ease)} .view.back{animation:fromleft .25s var(--ease)} .view.fade{animation:fadein .2s ease-out}
@keyframes fromright{from{transform:translateX(40px)}to{transform:none}}
@keyframes fromleft{from{transform:translateX(-40px)}to{transform:none}}
@keyframes fadein{from{opacity:.55}to{opacity:1}}

/* ---------- the course map ---------- */
.map-head{display:flex;align-items:center;gap:16px}
.map-head .sig{width:48px;height:48px;background:var(--yellow);border-radius:14px;padding:8px;color:var(--on-yellow)}
.map{position:relative;margin:0 -16px;overflow:hidden}
.map svg.bg,.map svg.line{position:absolute;left:0;top:0;pointer-events:none}
.map .line-ahead{stroke:var(--yellow);opacity:.32} .map .line-done{stroke:var(--yellow)}
.map .line-edge{stroke:var(--bg)}
.st{position:absolute;display:flex;align-items:center;gap:16px;transform:translate(-50%,-50%)}
.st .mk{width:72px;height:72px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;flex:none;box-shadow:inset 0 0 0 6px var(--yellow),var(--shadow);transition:transform .1s,box-shadow .1s}
.st button.mk:active{transform:scale(.98);box-shadow:inset 0 0 0 6px var(--yellow),0 0 0 var(--line-2)}
.st .mk .sig{width:42px;height:42px}
.st .lab{position:absolute;top:50%;transform:translateY(-50%);width:max-content;max-width:40vw;display:flex;flex-direction:column;line-height:1.2;pointer-events:none}
.st.lab-r .lab{left:calc(100% + 16px)} .st.lab-l .lab{right:calc(100% + 16px);text-align:right;align-items:flex-end}
.st .lab b{font-family:var(--display);font-weight:800;font-size:var(--t-body)}
.st .lab span{font-size:var(--t-cap);color:var(--muted);font-weight:700}
.st .lab .soon{display:inline-block;margin-top:4px;font-size:var(--t-cap);font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.st.done .mk{background:var(--yellow);box-shadow:var(--shadow)}
.st.done .mk .sig{opacity:.4;filter:saturate(.6)}
.st.done .mk .tick{position:absolute;inset:16px}
.st.now .mk{width:96px;height:96px;box-shadow:inset 0 0 0 8px var(--yellow),var(--shadow)}
.st.now .mk .sig{width:56px;height:56px}
.st.now .mk::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--yellow);animation:halo 2s var(--ease) infinite}
@keyframes halo{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.st.now .lab b{font-size:var(--t-de)}
.st.locked .mk{box-shadow:inset 0 0 0 4px var(--line-2)}
.st.locked .mk .sig{filter:grayscale(1);opacity:.45}
.st .lock{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.st .lock svg{width:14px;height:14px}
.st.soon .mk{background:transparent;box-shadow:none;border:3px dashed var(--line-2);cursor:default}
.st.soon .mk .sig{filter:grayscale(1);opacity:.28}
.st.soon .lab{opacity:.7}
.st.rv .mk{width:52px;height:52px;color:var(--ink);box-shadow:inset 0 0 0 4px var(--yellow)}
.st.rv .mk .sig{width:26px;height:26px}
.st.rv.done .mk{background:var(--yellow);color:var(--on-yellow);box-shadow:none}
.st.rv.locked .mk{box-shadow:inset 0 0 0 4px var(--line-2);color:var(--muted)}
.st.rv.soon .mk{border-width:3px;color:var(--muted);box-shadow:none;background:transparent}
.st.start .mk{width:56px;height:56px} .st.start .mk .sig{width:32px;height:32px}
.st.term .mk{width:72px;height:72px;background:var(--card);border:3px dashed var(--line-2);box-shadow:none}
.st.just-done .mk{animation:fillin .6s var(--spring)}
.st.arrive .mk{animation:bounce .55s var(--spring)}
@keyframes fillin{0%{transform:scale(.85)}100%{transform:none}}
@keyframes bounce{0%{transform:translateY(0)}35%{transform:translateY(-14px)}100%{transform:none}}
.st .write{pointer-events:auto;margin-top:8px}
.chapter{position:absolute;left:50%;transform:translate(-50%,-50%);width:min(88%,460px);background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
.chapter .num{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:var(--on-yellow);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;flex:none}
.chapter b{font-family:var(--display);font-weight:800;display:block} .chapter span{font-size:var(--t-cap);opacity:.8}
.train{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2}
.train svg{position:absolute;left:-36px;top:-36px;width:72px;height:72px;overflow:visible}
.weiter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-weight:800;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;min-height:48px;transition:opacity .2s,transform .2s var(--ease)}
.weiter[hidden]{display:flex!important;opacity:0;pointer-events:none;transform:translate(-50%,16px)}
body:not(.lay-mobile) .weiter{bottom:24px}

/* ---------- bottom sheets ---------- */
.sheet{position:fixed;inset:0;background:rgba(16,24,43,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fadein .2s ease-out}
.sheet .in{position:relative;background:var(--card);border-radius:28px 28px 0 0;padding:8px max(24px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-right,0px));width:100%;max-width:600px;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:16px;animation:sheetup .3s var(--spring);touch-action:pan-y}
.sheet.closing{animation:fadeout .2s forwards} .sheet.closing .in{animation:sheetdown .22s var(--ease) forwards}
@keyframes sheetup{from{transform:translateY(48px)}to{transform:none}}
@keyframes sheetdown{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--line-2);margin:4px auto 8px;flex:none}
.sheet .close{position:absolute;right:16px;top:16px}
.preview{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.preview .bigicon{width:120px;height:120px;border-radius:36px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center}
.preview .bigicon .sig{width:88px;height:88px}
.preview .bigicon.rv{color:var(--ink)}
.preview .facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.preview .can{background:var(--bg-2);border-radius:18px;padding:16px;text-align:left;width:100%}
.preview .btn{width:100%}

/* ---------- completion ticket ---------- */
.ticket{position:relative;background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:grid}
.ticket .top{background:var(--yellow);color:var(--on-yellow);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.ticket .top b{font-family:var(--display);font-size:var(--t-body)}
.ticket .body{padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.ticket .perf{height:0;border-top:3px dashed var(--line);margin:0 24px;position:relative}
.ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.ticket .perf::before{left:-38px} .ticket .perf::after{right:-38px}
.stamp{width:136px;height:136px;border-radius:50%;border:4px dashed var(--blue);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);animation:stamp .55s var(--spring) .15s;background:var(--blue-soft)}
.stamp .sig{width:84px;height:84px}
@keyframes stamp{0%{transform:scale(1.5) rotate(-20deg)}60%{transform:scale(.94) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 24px 24px}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat .n{font-family:var(--display);font-size:var(--t-title);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:var(--t-cap);font-weight:800;color:var(--muted)}

/* ---------- today ---------- */
.today-hero{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:24px;display:flex;align-items:center;gap:16px;overflow:hidden;position:relative}
.today-hero h1{color:var(--bg)}
body.lay-mobile .today-hero{padding:16px;gap:12px} body.lay-mobile .today-hero h1{font-size:var(--t-de)} body.lay-mobile .today-hero .goal{width:64px;height:64px} body.lay-mobile .today-hero .goal .ring{width:64px!important;height:64px!important} .today-hero p{color:var(--bg);opacity:.8;font-size:var(--t-cap)}
.today-hero .goal{margin-left:auto;position:relative;width:80px;height:80px;flex:none}
.today-hero .goal .ring circle.bg{stroke:rgba(255,255,255,.14)} .today-hero .goal .ring circle.fg{stroke:var(--yellow)}
.today-hero .goal .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;line-height:1}
.today-hero .goal .inner small{font-size:var(--t-cap);font-weight:700;opacity:.75;font-family:var(--text)}
.nextcard{display:flex;align-items:center;gap:16px}
.nextcard .sig{width:72px;height:72px;background:var(--yellow-soft);border-radius:22px;padding:12px}

/* ---------- word bank, lists, misc ---------- */
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.bank .grp{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px}
.bank .grp .sig{width:28px;height:28px}
.btile{background:var(--card);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;position:relative;cursor:pointer;min-height:120px;box-shadow:inset 0 0 0 2px var(--line);transition:transform .08s,box-shadow .08s}
.btile:active{transform:scale(.98);box-shadow:inset 0 0 0 2px var(--line)}
.btile .de{font-family:var(--display);font-weight:800;line-height:1.2}
.btile .en{font-size:var(--t-cap);color:var(--muted)}
.btile .ring{position:absolute;top:8px;right:8px;width:22px;height:22px}
.listrow{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:16px 24px}
.listrow>.sig{width:48px;height:48px;background:var(--yellow-soft);border-radius:14px;padding:6px}
.hero{display:flex;gap:16px;align-items:center}
.rule{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.rule .k{font-family:var(--display);font-size:var(--t-de);font-weight:800;color:var(--blue);min-width:56px}
.rule .ex{display:flex;flex-wrap:wrap;gap:8px}
.rule .ex button{padding:4px 12px;border-radius:12px;background:var(--bg-2);font-weight:800}
.rule .ex small{display:block;color:var(--muted);font-weight:600;font-size:var(--t-cap)}
.tbl{display:grid;gap:4px 16px;grid-template-columns:auto 1fr;font-size:var(--t-cap)}
.tbl b{color:var(--muted)}

body.in-talk main{padding-bottom:240px}

/* =====================================================================
   GLASS SKIN: frosted panes, lit edges, long shadows, one luminous accent.
   Loaded after the layout rules so it owns every surface decision.
   ===================================================================== */
:root{--tile-hi:rgba(255,255,255,.9); --tile-lo:rgba(29,106,224,.10); --scrim:rgba(8,18,36,.30)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tile-hi:rgba(255,255,255,.10); --tile-lo:rgba(95,169,255,.10); --scrim:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--tile-hi:rgba(255,255,255,.10); --tile-lo:rgba(95,169,255,.10); --scrim:rgba(0,0,0,.55)}

body{font-weight:500;background:var(--bg);letter-spacing:.003em}
b,strong{font-weight:700}
h1,h2,h3{font-weight:700;letter-spacing:-.025em}
h2,h3{letter-spacing:-.01em}
#app{position:relative;z-index:1;overflow-x:clip}

/* the field behind everything: drifting light, a faint engineering grid */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--bg) 0%,var(--bg-deep) 100%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.aurora i:nth-child(1){width:62vmax;height:62vmax;left:-18vmax;top:-26vmax;background:var(--aur-1);animation:drift1 38s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:54vmax;height:54vmax;right:-20vmax;top:18vh;background:var(--aur-2);animation:drift2 46s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:46vmax;height:46vmax;left:20vw;bottom:-30vmax;background:var(--aur-3);animation:drift1 52s ease-in-out infinite alternate-reverse}
.aurora::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(90% 70% at 50% 0%,#000 0%,transparent 75%);mask-image:radial-gradient(90% 70% at 50% 0%,#000 0%,transparent 75%)}
@keyframes drift1{to{transform:translate(8vw,6vh) scale(1.08)}}
@keyframes drift2{to{transform:translate(-10vw,-4vh) scale(.94)}}

/* ---------- glass recipe ---------- */
.card,.widget,.kpi,.goalmini,.conv,.ticket,.notice-line,.lv,.sidebar-glass{
  background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:inset 0 0 0 1px var(--glass-edge),inset 0 1px 0 var(--glass-hi),var(--shadow)}
.card.soft{background:var(--bg-2);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 1px var(--line)}
.card.flat{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 1px var(--line-2)}
.card,.widget{border-radius:var(--r)}
.notice-line{border-left:0;position:relative;overflow:hidden}
.notice-line::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--ice),var(--yellow));box-shadow:0 0 12px var(--glow)}

/* inner controls sit on glass: lighter, no blur of their own */
.choice,.tile,.btile,.mode,.scen,.icon-btn,.umlauts button,.btn.ghost,.btn.quiet,.seg,.rule .ex button{
  background:var(--card);box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--glass-hi),0 1px 2px rgba(16,36,72,.06),0 6px 14px -8px rgba(16,36,72,.22);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s}
.mode,.scen,.btile{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.choice:hover,.mode:hover,.scen:hover,.btile:hover,.tile:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--yellow),inset 0 1px 0 var(--glass-hi),0 0 0 4px var(--yellow-soft),var(--shadow)}
.choice:active,.mode:active,.scen:active,.btile:active,.tile:active,.icon-btn:active,.umlauts button:active{transform:scale(.975);box-shadow:inset 0 0 0 1px var(--line-2),inset 0 2px 6px rgba(16,36,72,.12)}
.icon-btn:hover,.umlauts button:hover{box-shadow:inset 0 0 0 1px var(--yellow),inset 0 1px 0 var(--glass-hi),0 0 0 3px var(--yellow-soft)}
.choice.ok{background:linear-gradient(var(--green-soft),var(--green-soft)),var(--card);color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green),0 0 22px -6px var(--green)}
.choice.bad{background:linear-gradient(var(--red-soft),var(--red-soft)),var(--card);color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red),0 0 22px -6px var(--red)}
.choice.picked{background:linear-gradient(var(--blue-soft),var(--blue-soft)),var(--card);box-shadow:inset 0 0 0 1.5px var(--blue),0 0 0 4px var(--blue-soft)}
.card.ok-edge{box-shadow:inset 0 0 0 1.5px var(--green),0 0 30px -8px var(--green),var(--shadow)}
.card.bad-edge{box-shadow:inset 0 0 0 1.5px var(--red),0 0 30px -8px var(--red),var(--shadow)}

/* ---------- buttons: glossy ink with a lit lip ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate;border-radius:16px;font-weight:700;letter-spacing:.005em;
  background:linear-gradient(180deg,var(--act-1),var(--act-2));color:var(--act-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 0 0 1px rgba(255,255,255,.07),0 2px 4px rgba(6,14,30,.14),0 12px 26px -12px var(--act-glow);
  transition:transform .16s var(--ease),box-shadow .2s var(--ease),filter .2s}
.btn::before{content:"";position:absolute;inset:0 0 50% 0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0));pointer-events:none;z-index:-1}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.08),0 4px 8px rgba(6,14,30,.12),0 18px 34px -12px var(--act-glow)}
.btn:active{transform:scale(.98);filter:brightness(.96)}
.btn.sm{border-radius:12px}
.btn.ghost,.btn.quiet{color:var(--ink)}
.btn.ghost::before,.btn.quiet::before{display:none}
.btn.ghost:hover,.btn.quiet:hover{filter:none;box-shadow:inset 0 0 0 1px var(--yellow),inset 0 1px 0 var(--glass-hi),0 0 0 4px var(--yellow-soft)}
.btn.ink{background:linear-gradient(180deg,#2a3a57,#05080f);color:#fff}
.btn.ok,.actionbar.ok .in .btn:not(.ghost){background:linear-gradient(180deg,var(--green),var(--green-deep));color:var(--on-status);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 26px -12px var(--green)}
.btn.bad,.actionbar.bad .in .btn:not(.ghost){background:linear-gradient(180deg,var(--red),var(--red-deep));color:var(--on-status);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 26px -12px var(--red)}
.btn[disabled]{opacity:.38;transform:none;filter:saturate(.4);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.icon-btn{color:var(--ink)}

.lesson-top .segs i{background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--line)}
.lesson-top .segs i b{background:linear-gradient(90deg,var(--yellow),var(--ice));box-shadow:0 0 10px var(--glow)}

/* ---------- frame: floating glass chrome ---------- */

.tab[aria-current="page"]{background:var(--card);box-shadow:inset 0 0 0 1px var(--glass-edge),inset 0 1px 0 var(--glass-hi),var(--shadow)}

body.lay-mobile .tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));padding:8px;border-radius:26px;
  background:var(--card);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 0 0 1px var(--glass-edge),inset 0 1px 0 var(--glass-hi),var(--shadow-lg)}

.bub.l .box{background:linear-gradient(160deg,var(--yellow),var(--yellow-deep));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 24px -14px var(--glow)}

:root[data-theme="dark"] .bub.l .box{color:#03101f} :root[data-theme="dark"] .bub.l .box .gl .e,:root[data-theme="dark"] .bub.l .box .faint{color:rgba(3,16,31,.75)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bub.l .box{color:#03101f} :root:not([data-theme="light"]) .bub.l .box .gl .e,:root:not([data-theme="light"]) .bub.l .box .faint{color:rgba(3,16,31,.75)}}

/* ---------- the teacher: a thin clear glass orb with a small blue core of light.
   --lvl (0..1) is driven by VoiceLight in time with the voice; at rest the core glows dimly. ---------- */
.tslot{display:none!important}
.orb{--s:56px;--lvl:0;position:absolute;inset:0;display:block;pointer-events:none}
.orb.companion{position:fixed;inset:auto;left:0;top:0;width:var(--s);height:var(--s);z-index:22;will-change:transform;animation:orbin .6s var(--ease)}
@keyframes orbin{from{opacity:.25}to{opacity:1}}
.orb .ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 52%,rgba(185,222,255,.16) 76%,rgba(225,242,255,.5) 100%),
    radial-gradient(circle at 50% 52%,rgba(70,150,255,calc(.05 + var(--lvl) * .26)) 0%,rgba(70,150,255,0) 68%);
  -webkit-backdrop-filter:blur(2.5px) saturate(150%);backdrop-filter:blur(2.5px) saturate(150%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.62),0 0 0 1px rgba(28,66,132,.16),
    inset calc(var(--s) * -.05) calc(var(--s) * -.07) calc(var(--s) * .12) rgba(12,44,116,.22),
    inset calc(var(--s) * .03) calc(var(--s) * .04) calc(var(--s) * .07) rgba(255,255,255,.36),
    0 calc(var(--s) * .10) calc(var(--s) * .22) calc(var(--s) * -.07) rgba(10,40,100,.22),
    0 0 calc(var(--s) * (.08 + var(--lvl) * .7)) calc(var(--s) * var(--lvl) * .05) rgba(70,150,255,calc(.08 + var(--lvl) * .5));
}
.orb .float{position:absolute;inset:0;animation:orbfloat 5s ease-in-out infinite}
.orb .glc{position:absolute;left:-25%;top:-25%;width:150%;height:150%;pointer-events:none;display:block}
.orb.gl .ball{background:none;box-shadow:none} .orb.gl .ball>*{display:none}
.orb .core{position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;
  background:radial-gradient(circle at 40% 34%,rgba(225,243,255,calc(.30 + var(--lvl) * .7)) 0%,#4ea6ff 34%,#1550c6 70%,rgba(12,44,150,.15) 100%);
  transform:scale(calc(1 + var(--lvl) * .34));
  filter:brightness(calc(.72 + var(--lvl) * .78)) saturate(calc(1 + var(--lvl) * .35));
  box-shadow:0 0 calc(var(--s) * (.05 + var(--lvl) * .30)) calc(var(--s) * (.008 + var(--lvl) * .05)) rgba(80,165,255,calc(.30 + var(--lvl) * .62));
  animation:corebreathe 6s ease-in-out infinite}
.orb .core::after{content:"";position:absolute;inset:-130%;border-radius:50%;background:radial-gradient(circle,rgba(90,170,255,calc(.08 + var(--lvl) * .42)) 0%,rgba(90,170,255,0) 58%);pointer-events:none}
.orb .caustic{position:absolute;left:20%;right:20%;bottom:5%;height:20%;border-radius:50%;background:radial-gradient(ellipse at 50% 80%,rgba(160,215,255,.9),rgba(160,215,255,0) 70%);opacity:calc(.22 + var(--lvl) * .7)}
.orb .glare{position:absolute;left:17%;top:6%;width:56%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0) 85%);transform:rotate(-16deg)}
.orb .spark{position:absolute;left:25%;top:15%;width:9%;height:6%;border-radius:50%;background:#fff;transform:rotate(-32deg);box-shadow:0 0 calc(var(--s) * .05) rgba(255,255,255,.9)}
.orb .shadow{position:absolute;left:50%;top:calc(var(--s) * .86 + var(--sh-y,10px));width:calc(var(--s) * var(--sh-w,.64));height:calc(var(--s) * .16);margin-left:calc(var(--s) * var(--sh-w,.64) / -2);translate:var(--sh-x,4px) 0;border-radius:50%;background:radial-gradient(ellipse,rgba(var(--sh-c,8,28,72),var(--sh-o,.28)) 0%,rgba(var(--sh-c,8,28,72),calc(var(--sh-o,.28) * .45)) 38%,transparent 70%);filter:blur(var(--sh-b,3px));animation:orbshadow 5s ease-in-out infinite}
.orb .shadow::after{content:"";position:absolute;inset:-40% -10%;border-radius:50%;background:radial-gradient(ellipse,rgba(80,160,255,.75),transparent 65%);opacity:calc(var(--lvl) * var(--sh-pool,.6))}
.orb .halo{display:none}
.orb.thinking .core{filter:hue-rotate(28deg) brightness(calc(.72 + var(--lvl) * .95))} .orb.thinking .core{animation-duration:3s}

  return { verbs, nouns };
}

/* ---------- Goal / pace (§3) ---------- */

const GENDER_ART = { m: 'der', f: 'die', n: 'das' };
const GENDER_EIN = { m: 'ein', f: 'eine', n: 'ein' };

// Compare answer with target line. Returns {ok:true, exact, note?} or {ok:false, kind, hint, caps?}
function diagnose(answer, target, lex, glossStr, alts = []) {

  const targetsAll = [T, ...alts.map(a => deTokens(a))];
  for (const tt of targetsAll) {
    if (same(A, tt)) {
      const umlautOff = A.some((w, i) => fold(w) === fold(tt[i]) && w.toLowerCase() !== tt[i].toLowerCase());
      const capsOff = A.some((w, i) => w !== tt[i] && w.toLowerCase() === tt[i].toLowerCase());
      if (umlautOff) notes.push('Accepted. The real spelling uses <em>' + esc(tt.join(' ')) + '</em> (ä ö ü ß buttons are below the box).');
      if (capsOff) { const n = tt.find((w, i) => A[i] !== w && /^[A-ZÄÖÜ]/.test(w)); if (n) notes.push('Nouns are capitalised: <em>' + esc(n) + '</em>.'); }

    }

  for (let i = 0; i < T.length; i++) {
    const t = T[i], tf = Tf[i];
    if (Af.includes(tf)) continue; // present somewhere
    // verb ending: a form of the same lemma present in answer
    const lemma = verbLemmaOf(t, lex);
    if (lemma) {

      if (wrongForm) { const p = personOf(T, i); const forms = lex.verbs[lemma]; return { ok: false, kind: 'verb', hint: `Right verb. With <em>${p}</em>, <em>${esc(lemma)}</em> is <em>${esc(forms[p] || t)}</em>${lemma === 'sein' ? '' : ' (' + PERSON_END[p] + ')'}: <em>${esc(p + ' ' + (forms[p] || t))}</em>.` + (p === 'Sie' ? ' <em>Sie</em> works like <em>usted</em>, but takes the plural form.' : '') }; }

      const hasStem = Af.includes(fold(stem)), hasPre = Af.includes(fold(pre)), preLast = Af[Af.length - 1] === fold(pre), joined = Af.includes(fold(pre + stem));

    }

        if (ARTICLES[fold(given)] !== g) return { ok: false, kind: 'gender', hint: `<em>${esc(noun)}</em> is ${GENDER_NAME[g]}: <em>${GENDER_ART[g]} ${esc(noun)}</em>, <em>${GENDER_EIN[g]} ${esc(noun)}</em>.` };
        return { ok: false, kind: 'case', hint: `Right gender, wrong case. Here it is <em>${esc(t)}</em>: <em>${esc(t + ' ' + noun)}</em>.` };
      }

    if (near) return { ok: false, kind: 'spelling', hint: `Almost: check the spelling of <em>${esc(t)}</em>.` };

/* ---------- Generate a lesson with Claude (§12) ---------- */

    try {
      const r = await S.sample.json(`Write lesson ${n} of a German course for an English speaker (fluent in Spanish) aiming for spoken B1, with ONE conversation partner, Herr Weber (teacher in Berlin, uses Sie). Theme: ${plan.topic}. The lesson is set at or near the Berlin U-Bahn station ${plan.station}.\nLearner profile: ${JSON.stringify(S.profile)}. Already-known words (do not teach again, may reuse): ${known.join(', ')}.\nReply with ONLY a JSON object with exactly the shape and conventions of this example lesson (same keys, same gloss format "de=en | de=en" where glosses are meaning in context and fixed phrases get one span, every German token glossed, conversation of 8–12 turns alternating Herr Weber {w,g,mood} and learner turns {l:true,de,en,g,type,gaps,extra,alts,react} with a mix of tiles/gap/translate and ONE free turn, lexicon with every verb's forms and every noun's gender, no "pic" field, 10–12 new words with ipa, resp (stressed syllable CAPS), syl with ·, example with the word in [brackets], exEn, exG). Scene id must be one of: classroom, cafe, ubahn, spaeti, stairwell. Example:\n${spec}`, { modelTier: 'default', cache: false });

  if (bad.length) return bad;
  if (!Array.isArray(L.words) || L.words.length < 8 || L.words.length > 14) bad.push('need 8–14 words');
  (L.words || []).forEach(w => { for (const k of ['de', 'en', 'type', 'ex', 'exEn', 'exG']) if (!w[k]) bad.push('word ' + (w.de || '?') + ' missing ' + k); if (!Array.isArray(w.en)) w.en = [String(w.en)]; if (known.includes(w.de)) bad.push('duplicate known word ' + w.de); });

  const newest = [...all].sort((a, b) => String(b.c.since || '').localeCompare(String(a.c.since || '')) || (b.c.lesson || 0) - (a.c.lesson || 0)).slice(0, 40);
  const weak = all.filter(x => x.c.r && x.c.r[4] >= 1);
  const pick = [...new Map([...shuffle(weak).slice(0, Math.ceil(n / 4)), ...shuffle(newest).slice(0, Math.ceil(n / 2)), ...shuffle(all)].map(x => [x.id, x])).values()].slice(0, n);
  return shuffle(pick);
}
function drillSession(kind, n = 12) { const items = drillPool(n, kind !== 'mc').map(x => ({ id: x.id, sh: cardShard(x.id), c: x.c, kind, extra: true })); if (!items.length) { toast('Not enough words with example sentences yet.'); return; } startReview(items); }

/* ---------- 3D tilt: the glass pane under the pointer turns toward it and catches the light ---------- */
(() => {
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const SEL = '.card.primary,.examcard,.today-hero,.talkhero,.ticket,.view > .lesson-top ~ .card';
  let cur = null, raf = 0, last = null;
  const clear = el => { el.classList.remove('tilting'); ['--rx', '--ry', '--mx', '--my'].forEach(k => el.style.removeProperty(k)); };
  const apply = () => { raf = 0; if (!last) return; const e = last; if (reduced()) return;
    const el = e.target.closest && e.target.closest(SEL);
    if (el !== cur) { if (cur) clear(cur); cur = el; }
    if (!el || el.closest('.sheet') || document.body.classList.contains('in-lesson')) { if (el) clear(el); return; }
    const r = el.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const k = Math.max(3, Math.min(10, 2600 / Math.max(r.width, r.height)));  // big panes tilt less
    el.style.setProperty('--ry', ((x - .5) * k).toFixed(2) + 'deg'); el.style.setProperty('--rx', ((.5 - y) * k).toFixed(2) + 'deg');
    el.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); el.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    el.classList.add('tilting'); };
  document.addEventListener('pointermove', e => { last = e; if (!raf) raf = requestAnimationFrame(apply); }, { passive: true });
  document.addEventListener('pointerleave', () => { if (cur) clear(cur); cur = null; });
  document.addEventListener('scroll', () => { if (cur) { clear(cur); cur = null; } }, { passive: true });
})();
/* ---------- boot ---------- */
document.addEventListener('keydown', e => { if (e.target.matches('textarea')) return; if (e.target.matches('input') && e.key !== 'Enter') return; if (KEYS) KEYS(e); });
(async function boot() {
  loadLocal(); applyTheme();
  const hash = (location.hash || '').replace('#', ''); if (NAV_ITEMS.some(t => t[0] === hash)) route = hash; lastLayout = applyLayout();
  LESSONS.forEach(L => { const bad = checkGlosses(L); if (bad.length) console.warn('Gloss coverage, lesson ' + L.n, bad); });
  V1_WORDS.forEach(w => { const a = deTokens(w.ex.replace(/[\[\]]/g, '')).map(fold).join(' '), b = parseGloss(w.exG).flatMap(([d]) => deTokens(d)).map(fold).join(' '); if (a !== b) console.warn('Gloss coverage, v1 word ' + w.de, a, '|', b); });
  render();
  if (!S.settings.onboarded) onboarding();
  await loadRemote(); S.ready = true; flushPendingSaves(); applyTheme();
  if (!S.settings.onboarded && !document.querySelector('.sheet')) onboarding(); else if (S.settings.onboarded) { document.querySelector('.sheet:not(.word)')?.remove(); render(); }
})();
