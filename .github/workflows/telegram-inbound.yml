# Picks up the owner's Telegram messages every few minutes and posts them on
# the Team brief (issue #1), where every agent reads its direction.
# See .github/telegram/relay.py.
name: Telegram – owner messages

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: telegram-inbound
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/telegram
      - run: python3 .github/telegram/relay.py inbound
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          # Messages sent before the relay existed (the bot's setup chat) are skipped.
          RELAY_SINCE: "1792817566"
